name: Deploy ADEX ERP to Oracle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adex-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oracle-production
    steps:
      - name: Validate deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          test -n "$ORACLE_HOST" || (echo "Missing ORACLE_HOST secret" && exit 1)
          test -n "$ORACLE_USER" || (echo "Missing ORACLE_USER secret" && exit 1)
          test -n "$ORACLE_SSH_KEY" || (echo "Missing ORACLE_SSH_KEY secret" && exit 1)
          test -n "$ORACLE_KNOWN_HOSTS" || (echo "Missing ORACLE_KNOWN_HOSTS secret" && exit 1)

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify Oracle application
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n /usr/local/sbin/adex-deploy'
