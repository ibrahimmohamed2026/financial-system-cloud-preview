name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: "ci-only-test-secret-not-for-production-2026"
          DATABASE_URL: "sqlite:///./ci-test.db"
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check cheque register JavaScript
        run: node --check web/pages/financial_checks.js
      - name: Check treasury JavaScript
        run: node --check web/pages/treasury.js
